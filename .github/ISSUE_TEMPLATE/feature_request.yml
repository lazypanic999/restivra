name: Feature request / Özellik önerisi
description: Describe the workflow you need and its practical value.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / İhtiyaç
      description: What are you trying to do? How do you handle it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Önerilen davranış
      description: Describe the smallest useful change and alternatives.
    validations:
      required: true
