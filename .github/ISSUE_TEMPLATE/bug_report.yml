name: Bug report / Hata bildirimi
description: Report a reproducible problem with synthetic data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English / Türkçe is welcome. Never attach real dumps, .env, tokens or private SQL.
        Security issue? Use the private reporting link instead.
  - type: textarea
    id: environment
    attributes:
      label: Environment / Ortam
      description: Running version from Setup → System check, checkout commit, OS, Docker version and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / Tekrarlama adımları
      description: Use a minimal synthetic archive or SQL example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result / Beklenen ve gerçekleşen
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics / Temizlenmiş tanı bilgileri
      description: Optional reviewed support summary from Setup → System check. It includes counts; review before sharing. Remove private information from any logs or screenshots. Never attach .env, source profiles or real restore reports.
