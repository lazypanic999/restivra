name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm audit --audit-level=low && npm test && npm run build
        working-directory: web
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: docker pull postgres:17-bookworm
      - run: docker pull rustfs/rustfs:1.0.5
      - name: SQL check templates on PostgreSQL 17
        run: npm test
        working-directory: web
        env:
          RESTIVRA_INTEGRATION: '1'
      - run: go test -p 1 ./... -count=1 -timeout=10m
        env:
          RESTIVRA_INTEGRATION: '1'
      - run: go build ./cmd/restivra
      - name: Fresh pilot setup and Docker-only smoke
        shell: pwsh
        env:
          COMPOSE_PROJECT_NAME: restivra-pilot-ci
          RESTIVRA_PORT: '17474'
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/test-native-command.ps1
            ./scripts/test-release-ops.ps1
            ./scripts/test-metadata-backup.ps1
            ./scripts/setup.ps1
            $original = (Get-FileHash .env).Hash
            $sourceProfiles = (Get-FileHash private/sources.json).Hash
            ./scripts/setup.ps1
            if ((Get-FileHash .env).Hash -ne $original) { throw 'Repeated setup changed credentials.' }
            if ((Get-FileHash private/sources.json).Hash -ne $sourceProfiles) { throw 'Repeated setup changed private source profiles.' }
            docker compose -f compose.yaml -f compose.build.yaml up --build -d --wait --wait-timeout 180
            if ($LASTEXITCODE -ne 0) { throw 'Fresh Compose installation failed.' }
            ./scripts/pilot-smoke.ps1 -Base http://127.0.0.1:17474
            ./scripts/metadata-backup.ps1 -OutputPath work/ci-metadata.dump
            $smoke = Get-ChildItem work -Directory -Filter 'pilot-*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            $summary = Get-Content (Join-Path $smoke.FullName 'summary.json') -Raw | ConvertFrom-Json
            ./scripts/test-metadata-check.ps1 -MetadataArchive work/ci-metadata.dump -ApplicationArchive (Join-Path backups $summary.backup_pattern)
            ./scripts/test-metadata-paths.ps1
            ./qa/browser/run.ps1 -ApplicationImage restivra:local -Port 27479
          } finally {
            docker compose down
          }
  interrupted-release-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kill real updater processes and recover the previous release
        shell: pwsh
        run: ./scripts/test-release-recovery.ps1 -Port 27481
